name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y osra
      - run: pip install -r requirements.txt pytest
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE tests/ 2>&1 | tee pytest.log
      - name: report failures as annotations
        if: failure()
        shell: bash
        run: |
          # Failing test names and assertion lines, visible on the PR and via the checks API.
          grep -E "^(FAILED|ERROR) |^E   " pytest.log | head -10 | sed 's/^/::error::/' || true
